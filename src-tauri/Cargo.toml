[package]
name = "cc-analyzer"
version = "0.2.0"
description = "CC Analyzer"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/liang-zhenxiang/cc-analyzer"
# 维护者名单；版权归属见仓库根的 LICENSE / NOTICE（署名 CC Analyzer）
authors = [
    "liang-zhenxiang <116311683@qq.com>",
    "nicholyx <nicholyx@163.com>",
]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
