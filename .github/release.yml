# 发布说明的分类配置 —— GitHub 原生的 releases/generate-notes 会读它
#
# 为什么需要这份文件：generate-notes 生成的变更清单自带一套英文模板，
# 其中 `## What's Changed` / `## New Contributors` 是**改不掉的常量**（任何配置
# 都动不了那几个词，只能事后用脚本转，见 scripts/format-release-notes.sh），
# 而 `### 分类标题` 这一层是**可以配置**的。分类标题能用配置解决就不要靠后处理
# 去猜——猜错是静默的，配置错了至少能在这里读出来。
#
# 分类按 **PR 标签**匹配，不是按 conventional commit 前缀：GitHub 的分类配置
# 只认标签。标签有两条来源：
#   1. .github/labeler.yml 按**改动路径**打（frontend / tauri / ci / documentation …）；
#   2. .github/workflows/labeler.yml 按 **PR 标题前缀**打性质标签
#      （`feat*` → enhancement、`fix*` → bug）。
#
# 第 2 条是 Issue #221 的修复：性质标签原先只靠人工打，而 AI 维护者建 PR 时
# 从不打，于是**每个 PR 都只剩路径标签**；再加上每个 PR 都要写 CHANGELOG（`.md`），
# `documentation` 几乎人人都有，分类就一路落到「文档」。
#
# **顺序有意义**：一个 PR 归入第一个命中的分类。
#   - 性质标签（enhancement / bug / security）最先；
#   - 然后是构建 / CI / 依赖这类「做了什么」；
#   - **`documentation` 必须排在它们之后**：它按 `**/*.md` 匹配，而流程要求
#     每个用户可感知的改动都写 CHANGELOG，于是它几乎是每个 PR 的常客。
#     排在前面就会吞掉功能与修复（Issue #221 的实际形态）。
#   - `'*'` 通配必须放最后。
# 分类按「改动是什么性质」划分，不按「改到哪一层」——frontend / tauri 这类
# 位置标签几乎每个 PR 都有，拿它们当分类会让所有 PR 挤进同一格。
#
# 规则写在哪：见 .trellis/spec/guides/release-notes.md（发布说明必须中文）。
# 文档：https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  categories:
    - title: 新功能
      labels:
        - enhancement
    - title: 修复
      labels:
        - bug
    - title: 安全
      labels:
        - security
    - title: 构建与打包
      labels:
        - packaging
    - title: 持续集成与自动化
      labels:
        - ci
        - github_actions
        - automation
    - title: 依赖更新
      labels:
        - dependencies
    # `documentation` 放在所有「做了什么」之后：它按 `**/*.md` 匹配，而每个
    # 用户可感知的改动都要写 CHANGELOG，所以它几乎是每个 PR 的常客。
    # 只有**纯文档** PR（没命中上面任何一格的）才落到这里——那正是它该代表的意思。
    - title: 文档
      labels:
        - documentation
    # 通配放最后：没命中以上任何分类的 PR 全部落到这里。
    # 少了它，那些 PR 会从发布说明里**静默消失**——少一个 PR 比多一个空分类
    # 严重得多，而且很难有人发现。
    - title: 其他变更
      labels:
        - '*'
